{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login | Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Inter', Arial, sans-serif;
      }
      
      body {
        height: 100vh;
        background: linear-gradient(135deg, #d5d4ee, #6365f16e);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .login-wrapper {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        padding: 40px 35px;
        border-radius: 14px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.15);
        animation: fadeIn 0.5s ease;
      }
      
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      .login-wrapper h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #111827;
        font-weight: 600;
      }
      
      .form-group {
        margin-bottom: 18px;
      }
      
      label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        color: #374151;
        font-weight: 500;
      }
      
      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        font-size: 14px;
        transition: all 0.2s ease;
      }
      
      input:focus {
        border-color: #4f46e5;
        outline: none;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
      }
      
      .btn-login {
        width: 100%;
        padding: 12px;
        background: #4f46e5;
        border: none;
        color: #fff;
        font-size: 15px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.25s ease;
        font-weight: 600;
      }
      
      .btn-login:hover {
        background: #4338ca;
      }
      
      .messages {
        margin-bottom: 18px;
      }
      
      .alert {
        padding: 10px 12px;
        border-radius: 6px;
        font-size: 14px;
        margin-bottom: 8px;
      }
      
      .alert-success {
        background: #ecfdf5;
        color: #047857;
      }
      
      .alert-error {
        background: #fef2f2;
        color: #b91c1c;
      }
      
      .footer-text {
        text-align: center;
        margin-top: 18px;
        font-size: 13px;
        color: #6b7280;
      }
    </style>
  </head>

  <body>
    <div class="login-wrapper">
      <h2>Sign in to your Dashboard</h2>

      <!-- Django Messages -->
      {% if messages %}
        <div class="messages">
          {% for message in messages %}
            <div class="alert {% if message.tags == 'success' %}
                
                
                
                
                alert-success




              {% else %}
                
                
                
                
                alert-error




              {% endif %}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}

      <form method="POST">
        {% csrf_token %}

        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" placeholder="Enter username" required />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="Enter password" required />
        </div>

        <button type="submit" class="btn-login">Login</button>
      </form>

      <div class="footer-text">© {{ now|date:'Y' }}Lakeside Hospital</div>
    </div>
  </body>
</html>
