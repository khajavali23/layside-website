{% extends 'backend/base.html' %}

{% block title %}
  <title>Dashboard | {{ page_title }}</title>
{% endblock %}

{% block content %}
  <div class="container mt-4 form-wrapper">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="page-title mb-4">{{ page_title }}</h4>

        <form method="POST">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label">Question</label>
            {{ form.question }}
          </div>

          <div class="mb-3">
            <label class="form-label">Answer</label>
            {{ form.answer }}
          </div>

          <div class="mb-3">
            <label class="form-label">Priority</label>
            {{ form.priority }}
          </div>

          <button type="submit" class="btn btn-primary">{{ page_title }}</button>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
